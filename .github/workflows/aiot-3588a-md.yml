name: aiot-3588a ophub-6.6.y WITH MD+NETFILTER

# 与原版 kdev-build.sh 完全相同的编译流程，唯一区别：
# 额外生成一个 defconfig（aiot_3588a_md_defconfig），在其中打开 MD(软RAID) 与 netfilter，
# 然后让 kdev-build.sh 使用它。使 fnOS 能建存储池、Docker 能用 bridge+NAT。
on:
  workflow_dispatch:
  push:
    branches:
      - default
    paths:
      - '.github/workflows/aiot-3588a-md.yml'

env:
  TZ: Asia/Shanghai

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: aiot-3588a
          fetch-depth: 1

      - name: Install build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -qq -y ca-certificates
          sudo apt-get install -qq -y --no-install-recommends \
            acl aptly aria2 axel bc binfmt-support binutils-aarch64-linux-gnu bison \
            bsdextrautils btrfs-progs build-essential busybox ca-certificates ccache \
            clang coreutils cpio crossbuild-essential-arm64 cryptsetup curl \
            debian-archive-keyring debian-keyring debootstrap device-tree-compiler \
            dialog dirmngr distcc dosfstools dwarves e2fsprogs expect f2fs-tools \
            fakeroot fdisk file flex gawk gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            gdisk git gnupg gzip htop imagemagick jq kmod lib32ncurses-dev \
            lib32stdc++6 libbison-dev libc6-dev-armhf-cross libc6-i386 libcrypto++-dev \
            libelf-dev libfdt-dev libfile-fcntllock-perl libfl-dev libfuse-dev \
            libgcc-12-dev-arm64-cross libgmp3-dev liblz4-tool libmpc-dev libncurses-dev \
            libncurses5 libncurses5-dev libncursesw5-dev libpython2.7-dev \
            libpython3-dev libssl-dev libusb-1.0-0-dev linux-base lld llvm locales \
            lsb-release lz4 lzma lzop make mtools ncurses-base ncurses-term \
            nfs-kernel-server ntpdate openssl p7zip p7zip-full parallel parted patch \
            patchutils pbzip2 pigz pixz pkg-config pv python2 python2-dev python3 \
            python3-dev python3-distutils python3-pip python3-setuptools \
            python-is-python3 qemu-user-static rar rdfind rename rsync sed \
            squashfs-tools swig tar tree u-boot-tools udev unzip util-linux uuid \
            uuid-dev uuid-runtime vim wget whiptail xfsprogs xsltproc xxd xz-utils \
            zip zlib1g-dev zstd binwalk ripgrep sudo
          echo "mkimage: $(command -v mkimage || echo MISSING)"

      - name: Create MD+netfilter defconfig
        run: |
          SRC=arch/arm64/configs/aiot_3588a_defconfig
          DST=arch/arm64/configs/aiot_3588a_md_defconfig
          ls -l "$SRC"
          cp "$SRC" "$DST"
          for opt in BLK_DEV_MD MD_LINEAR MD_RAID0 MD_RAID1 MD_RAID10 MD_RAID456 NF_TABLES NF_TABLES_INET NF_NAT IP_NF_IPTABLES IP_NF_FILTER IP_NF_NAT IP_NF_TARGET_MASQUERADE NETFILTER_XTABLES NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_MATCH_CONNTRACK NETFILTER_XT_MATCH_MULTIPORT NETFILTER_XT_MATCH_COMMENT BRIDGE BRIDGE_NETFILTER; do
            sed -i "/^CONFIG_${opt}[= ]/d" "$DST"
            sed -i "/^# CONFIG_${opt} is not set/d" "$DST"
            echo "CONFIG_${opt}=y" >> "$DST"
          done
          echo '--- 追加的选项 ---'
          grep -E 'CONFIG_(BLK_DEV_MD|MD_RAID1|MD_RAID10|NF_TABLES|IP_NF_IPTABLES|IP_NF_TARGET_MASQUERADE)=' "$DST"
          sed -i 's/^DEFCONFIG=.*/DEFCONFIG="aiot_3588a_md_defconfig"/' kdev-build.sh
          echo '--- kdev-build.sh 的 DEFCONFIG 行 ---'
          grep -n 'DEFCONFIG=' kdev-build.sh

      - name: Build kernel
        run: |
          sudo ./kdev-build.sh
          echo '=== artifacts ==='
          ls -alh release/

      - name: Verify config in artifact
        run: |
          KCFG=$(ls release/config-* | head -1)
          echo "verify $KCFG"
          for k in CONFIG_BLK_DEV_MD CONFIG_MD_RAID1 CONFIG_MD_RAID10 CONFIG_NF_TABLES CONFIG_IP_NF_IPTABLES CONFIG_IP_NF_TARGET_MASQUERADE; do
            printf '%-34s' "$k"
            grep -E "^$k=y" "$KCFG" || echo 'MISSING'
          done

      - name: Upload Kernel to Release
        uses: ncipollo/release-action@main
        with:
          tag: aiot-3588a_ophub-6.6.y-md
          artifacts: ./release/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            # aiot-3588a ophub-6.6.y (MD + netfilter 版)

            在原版基础上打开了：
            - CONFIG_BLK_DEV_MD / MD_LINEAR / RAID0 / RAID1 / RAID10 / RAID456 —— 让 fnOS 能创建存储池（mdadm）
            - CONFIG_NF_TABLES / IP_NF_IPTABLES / IP_NF_NAT / MASQUERADE —— 让 Docker 能用 bridge + NAT

            用途：替换 aiot-3588a 固件构建里的 KERNEL_URL，产出可建存储池的固件。
